<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gostou do vídeo?</title>
<style>
  :root{
    --fundo-1:#4a2e18;
    --fundo-2:#663f21;
    --carvao:#1a100a;
    --amarelo:#f2c14e;
    --vermelho:#c1432f;
    --verde:#28803f;
    --creme:#fdfaf3;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
  }

  body{
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:
      repeating-linear-gradient(
        45deg,
        var(--fundo-1) 0px,
        var(--fundo-1) 40px,
        var(--fundo-2) 40px,
        var(--fundo-2) 80px
      );
    min-height:100vh;
    overflow:hidden;
    position:relative;
  }

  .cena{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .cartao{
    background:var(--creme);
    border-radius:18px;
    padding:36px 28px;
    max-width:420px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
    border:4px solid var(--carvao);
    position:relative;
    z-index:2;
  }

  .selo{
    display:inline-block;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--carvao);
    background:var(--amarelo);
    padding:5px 12px;
    border-radius:999px;
    font-weight:700;
    margin-bottom:18px;
    border:2px solid var(--carvao);
  }

  .emoji-topo{
    font-size:48px;
    margin-bottom:12px;
    display:block;
  }

  h1{
    font-size:24px;
    line-height:1.35;
    color:var(--carvao);
    margin:0 0 8px;
    font-weight:800;
  }

  .destaque{
    color:var(--vermelho);
  }

  .sub{
    color:#5a4a3f;
    font-size:14px;
    margin:0 0 28px;
  }

  .botoes{
    position:relative;
    display:flex;
    gap:16px;
    justify-content:center;
    align-items:center;
    min-height:64px;
  }

  button{
    font-family:inherit;
    font-size:17px;
    font-weight:700;
    padding:14px 30px;
    border-radius:10px;
    border:3px solid var(--carvao);
    cursor:pointer;
    transition:transform .12s ease;
  }

  #simBtn{
    background:var(--verde);
    color:white;
  }
  #simBtn:hover{
    transform:scale(1.05);
  }

  #naoBtn{
    background:var(--vermelho);
    color:white;
    position:relative;
  }

  #naoBtn.fugindo{
    position:fixed;
    z-index:50;
    transition:top .18s ease, left .18s ease;
  }

  .aviso-fuga{
    font-size:12px;
    color:#6b5a3f;
    margin-top:18px;
    min-height:16px;
    font-style:italic;
  }

  /* Tela de agradecimento */
  .cartao.oculto{
    display:none;
  }

  .tela-obrigado{
    display:none;
    text-align:center;
  }
  .tela-obrigado.ativa{
    display:block;
  }

  .cavalo-sorriso{
    font-size:72px;
    margin-bottom:8px;
    display:inline-block;
    animation:balancar 0.8s infinite alternate ease-in-out;
  }

  @keyframes balancar{
    0%{ transform:rotate(-8deg) scale(1); }
    100%{ transform:rotate(8deg) scale(1.1); }
  }

  .balao-fala{
    background:#eef7ee;
    border:3px solid var(--carvao);
    border-radius:12px;
    padding:14px;
    margin:16px 0;
    font-size:18px;
    font-weight:800;
    color:var(--carvao);
    position:relative;
  }

  .selo-final{
    display:inline-block;
    background:var(--carvao);
    color:var(--amarelo);
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    padding:8px 16px;
    border-radius:8px;
    font-weight:800;
    margin-top:12px;
    border:2px solid var(--amarelo);
  }

  @media (prefers-reduced-motion: reduce){
    .cavalo-sorriso{ animation:none; }
    #naoBtn.fugindo{ transition:none; }
  }
</style>
</head>
<body>

<div class="cena">

  <!-- Cartão de Pergunta -->
  <div class="cartao" id="cartaoPergunta">
    <span class="emoji-topo">🐴</span>
    <span class="selo">Pergunta Importante</span>
    <h1>Gostou do <span class="destaque">vídeo do cavalo</span>?</h1>
    <p class="sub">Seja honesto(a). Sua resposta é muito importante!</p>

    <div class="botoes">
      <button id="simBtn" onclick="confirmar()">Sim!</button>
      <button id="naoBtn">Não</button>
    </div>

    <p class="aviso-fuga" id="avisoFuga"></p>
  </div>

  <!-- Tela de Agradecimento -->
  <div class="cartao tela-obrigado" id="telaObrigado">
    <div class="cavalo-sorriso">🐴😁</div>
    <span class="selo">Resposta Registrada</span>
    
    <div class="balao-fala">
      "MUUUUUITO OBRIGADO! 🐴❤️"
    </div>

    <h1>Eu sabia que você ia gostar!</h1>
    <p class="sub">O cavalo ficou extremamente feliz com a sua aprovação!</p>

    <span class="selo-final">Aprovado pelo Cavalo ✅</span>
  </div>

</div>

<script>
  const naoBtn = document.getElementById('naoBtn');
  const aviso = document.getElementById('avisoFuga');

  const frasesFuga = [
    "Opção inválida! Tente o 'Sim'.",
    "O 'Não' correu pra longe!",
    "Nem tente clicar aqui!",
    "Esse botão e trote rápido demais...",
    "Você não tem escolha!",
    "A resposta certa é SIM!"
  ];

  let capturasEvitadas = 0;

  function fugir(){
    const largura = naoBtn.offsetWidth || 110;
    const altura = naoBtn.offsetHeight || 54;
    const margem = 16;

    const maxX = window.innerWidth - largura - margem;
    const maxY = window.innerHeight - altura - margem;

    const novoX = Math.max(margem, Math.random() * maxX);
    const novoY = Math.max(margem, Math.random() * maxY);

    naoBtn.classList.add('fugindo');
    naoBtn.style.left = novoX + 'px';
    naoBtn.style.top = novoY + 'px';

    capturasEvitadas++;
    aviso.textContent = frasesFuga[(capturasEvitadas - 1) % frasesFuga.length];
  }

  // Foge ao passar o mouse ou ao tocar na tela
  naoBtn.addEventListener('mouseenter', fugir);
  naoBtn.addEventListener('touchstart', function(e){
    e.preventDefault();
    fugir();
  }, {passive:false});

  // Garantia extra: impede o clique de qualquer forma
  naoBtn.addEventListener('click', function(e){
    e.preventDefault();
    fugir();
  });

  window.addEventListener('resize', function(){
    if(naoBtn.classList.contains('fugindo')){
      fugir();
    }
  });

  function confirmar(){
    document.getElementById('cartaoPergunta').classList.add('oculto');
    document.getElementById('telaObrigado').classList.add('ativa');
  }
</script>

</body>
</html>
